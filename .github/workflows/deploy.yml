name: Deploy

on:
  push:
    branches:
      - chatkit
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Debug GitHub auth context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "actor=${{ github.actor }}"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          if [ -n "$GH_TOKEN" ]; then
            echo "github_token_present=yes"
            echo "github_token_length=${#GH_TOKEN}"
          else
            echo "github_token_present=no"
          fi

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & Push (branch tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASEURL=${{ secrets.VITE_API_BASEURL }}
            VITE_CHATKIT_API_URL=${{ secrets.VITE_CHATKIT_API_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Upload Compose
        run: |
          scp -i key.pem -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=6 docker-compose.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/BTM_EMS_V3_FRONT-END/docker-compose.yml

      - name: Deploy
        run: |
          ssh -i key.pem -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          set -e

          echo '🚀 Deploy start'

          cd /opt/BTM_EMS_V3_FRONT-END

          echo '📦 login'
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          echo '⬇️ pull branch image'
          docker pull ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }}

          echo '🔁 switch latest pointer'
          docker tag ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }} \
                     ghcr.io/starenergyems/btm_ems_v3_frontend:latest

          echo '🔎 compose config'
          docker compose -p btm-ems-v3 -f docker-compose.yml config

          echo '🚀 restart container'
          if ! timeout 180s docker compose -p btm-ems-v3 -f docker-compose.yml up -d --no-build --force-recreate --remove-orphans; then
            echo '❌ compose up failed or timed out'
            docker compose -p btm-ems-v3 -f docker-compose.yml ps -a || true
            docker ps -a --filter name=btm-ems-3 || true
            docker images ghcr.io/starenergyems/btm_ems_v3_frontend || true
            docker logs --tail=120 btm-ems-v3-btm-ems-3-1 || true
            exit 1
          fi

          docker compose -p btm-ems-v3 -f docker-compose.yml ps

          echo '✨ done'
          "

      - name: Cleanup
        if: always()
        run: rm -f key.pem
