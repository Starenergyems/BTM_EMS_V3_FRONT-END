name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - chatkit
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Generate image tags
      - name: Prepare image tags
        id: image_vars
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_REPO="ghcr.io/${OWNER_LC}/${REPO_LC}"
          IMAGE_TAG="${IMAGE_REPO}:${{ github.ref_name }}-${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_REPO}:${{ github.ref_name }}-latest"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      # 3️⃣ Login GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 4️⃣ Build & Push Image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ steps.image_vars.outputs.image_tag }}
            ${{ steps.image_vars.outputs.image_latest }}

      # 5️⃣ Setup SSH key
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      # 6️⃣ Deploy to EC2
      - name: Deploy to EC2
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=20 -i key.pem"

          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -e

            echo '🚀 Start deploy'

            # project name（避免亂掉）
            export COMPOSE_PROJECT_NAME=btm_ems_v3_frontend_${{ github.ref_name }}

            cd /opt/BTM_EMS_V3_FRONT-END

            echo '📦 Pull latest image'
            docker login ghcr.io -u '${{ github.actor }}' -p '${{ github.token }}'
            docker compose pull btm-ems-3

            echo '🧹 Stop old containers safely'
            docker compose down --remove-orphans || true

            echo '🚀 Start new containers (force recreate)'
            docker compose up -d --force-recreate --remove-orphans btm-ems-3

            echo '📊 Status'
            docker compose ps

            echo '✨ Deploy done'
          "

      # 7️⃣ Cleanup SSH key
      - name: Cleanup
        if: always()
        run: rm -f key.pem
