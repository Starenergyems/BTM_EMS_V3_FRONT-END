name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - chatkit

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      # 1️⃣ 取得程式碼
      - name: Checkout repository
        uses: actions/checkout@v5
      
      # 2️⃣ 設定 SSH key
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      # 3️⃣ 驗證部署 Secrets
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          set -e

          [ -n "$EC2_HOST" ] || { echo "❌ EC2_HOST is empty. Please set repository secret EC2_HOST."; exit 1; }
          [ -n "$EC2_USER" ] || { echo "❌ EC2_USER is empty. Please set repository secret EC2_USER."; exit 1; }
          [ -n "$EC2_KEY" ] || { echo "❌ EC2_KEY is empty. Please set repository secret EC2_KEY."; exit 1; }

          if [[ "$EC2_HOST" == *" "* ]]; then
            echo "❌ EC2_HOST should be only hostname or IP (no spaces)."
            exit 1
          fi

          echo "✅ Required deploy secrets are present."
      
      # 4️⃣ SSH 部署到 EC2
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -e
            
            echo '🔧 修正專案目錄權限...'
            sudo chown -R ubuntu:ubuntu /opt/BTM_EMS_V3_FRONT-END
            
            echo '🛑 停止舊容器...'
            cd /opt/BTM_EMS_V3_FRONT-END || exit 1
            docker compose down || true
            
            echo '🧹 清理 Docker 舊資源...'
            docker system prune -a --volumes --force
            docker builder prune --all --force
            
            echo '🧹 清理系統資源...'
            sudo apt-get clean
            sudo apt-get autoremove --purge -y
            sudo journalctl --vacuum-time=3d
            sudo rm -rf /tmp/*
            
            echo '📂 拉最新程式碼...'
            git fetch --all
            git reset --hard origin/chatkit
            git clean -fd
            
            echo '🐳 建立並啟動新容器...'
            docker compose up -d --build
            
            echo '✅ 檢查容器狀態...'
            docker compose ps
            docker compose logs --tail=20 web
            
            echo '🔄 清理多餘 Docker（不影響新 build）...'
            docker image prune -af
            docker container prune -f
            docker volume prune -f
            
            echo '🔄 重載 Nginx (如果有)...'
            sudo systemctl reload nginx || true
            
            echo '✨ 部署完成！'
          "
      
      # 5️⃣ 清理本地 GitHub Action 用的 SSH key
      - name: Clean up SSH key
        if: always()
        run: rm -f key.pem
