name: Deploy

on:
  push:
    branches:
      - chatkit
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & Push (branch tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }}

      - name: Setup SSH
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy
        run: |
          ssh -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          set -e

          echo '🚀 Deploy start'

          cd /opt/BTM_EMS_V3_FRONT-END

          echo '📦 login'
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          echo '⬇️ pull branch image'
          docker pull ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }}

          echo '🔁 switch latest pointer'
          docker tag ghcr.io/starenergyems/btm_ems_v3_frontend:${{ github.ref_name }} \
                     ghcr.io/starenergyems/btm_ems_v3_frontend:latest

          echo '🚀 restart container'
          docker compose up -d

          echo '✨ done'
          "

      - name: Cleanup
        if: always()
        run: rm -f key.pem
